<!DOCTYPE html>
<html lang="es">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="author" content="Angelo Pomasongo">
   <title>Social Like</title>
   <link rel="stylesheet" href="static/css/style.css">
</head>

<body>

   <header class="barra-navegacion">
      <h1>Social Like</h1>
   </header>
   <main class="contenedor-principal">
      <div class="tarjeta-perfil">
         <img src="https://i.pinimg.com/736x/7e/08/6a/7e086a46f280630779b60561d0ef88af.jpg" alt="Pikachu"
            class="foto-perfil">
         <h2>Pikachu</h2>
         <button class="boton-perfil">Mi perfil</button>
      </div>
      <div class="muro-publicaciones">
         <h2 class="titulo-publicaciones">Últimas publicaciones</h2>
         <div class="publicacion">
            <div class="cabecera-publicacion">
               <h3>Rei</h3>
               <div class="seccion-me-gusta">
                  <span class="contador-me-gusta">0 like(s)</span>
                  <button class="boton-me-gusta">Like</button>
               </div>
            </div>
            <p>Acabo de configurar este nuevo <a href="#">bot de Discrod</a>, cuéntame que opinan ustedes.</p>
         </div>
         <div class="publicacion">
            <div class="cabecera-publicacion">
               <h3>Asuka</h3>
               <div class="seccion-me-gusta">
                  <span class="contador-me-gusta">0 like(s)</span>
                  <button class="boton-me-gusta">Like</button>
               </div>
            </div>
            <p>Acabo de leer este <a href="#">nuevo comic</a>. Denle un vistazo.</p>
         </div>
         <div class="publicacion">
            <div class="cabecera-publicacion">
               <h3>Shinji</h3>
               <div class="seccion-me-gusta">
                  <span class="contador-me-gusta">0 like(s)</span>
                  <button class="boton-me-gusta">Like</button>
               </div>
            </div>
            <p>No puedo dejar de escuchar este <a href="#">album</a>. ¿A quién más le gusta?</p>
         </div>
      </div>
   </main>

   <script src="static/js/script.js"></script>
</body>

</html>
